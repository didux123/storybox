# StoryBox Configuration

# Audio settings
audio:
  input:
    device: "default"  # ALSA device name or "default"
    sample_rate: 16000
    channels: 1
    format: "S16_LE"
    chunk_duration_ms: 40  # 20-40ms frames
  output:
    device: "default"
    sample_rate: 22050
    channels: 1

# Speech-to-Text (Whisper)
stt:
  model_path: "/home/maxence/models/whisper/ggml-small.bin"
  language: "fr"
  model_type: "small"  # small or base
  threads: 4

# Large Language Model (Cloud API via Celeste)
llm:
  model_path: "gemini-2.5-flash"  # Override in .env (gemini-2.5-flash, gpt-4o-mini, claude-3-5-sonnet)
  context_tokens: 2048
  threads: 4
  n_gpu_layers: 0  # CPU only on Pi
  temperature: 0.7
  top_p: 0.9
  repeat_penalty: 1.1

  # Prompt templates (now managed in configs/prompts.json - editable via Streamlit)
  prompts:
    plan: null  # Loaded from prompts.json
    chapter: null  # Loaded from prompts.json

# Text-to-Speech (Piper)
tts:
  model_path: "/home/maxence/models/piper/fr_FR-siwis-medium.onnx"
  config_path: "/home/maxence/models/piper/fr_FR-siwis-medium.onnx.json"
  sample_rate: 22050
  speaker_id: 0

  # Audio post-processing
  post_processing:
    noise_gate_threshold: -40  # dB
    compressor_ratio: 2.5
    normalize_lufs: -16.0

# GPIO Configuration (Raspberry Pi)
gpio:
  button_pin: 17
  button_pull: "up"  # up or down
  debounce_ms: 50
  long_press_duration_s: 3.0

  led_pins:
    status: 22
    progress_1: 23
    progress_2: 24

# State machine timing
timing:
  pre_roll_led_ms: 500  # Visual feedback before audio starts
  max_recording_duration_s: 30
  audio_buffer_ms: 300

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_dir: "/home/maxence/projects/storybox/logs"
  max_log_size_mb: 50
  backup_count: 3

  # Metrics to track
  metrics:
    - "latency_release_to_audio"
    - "tokens_per_second"
    - "model_load_time"
    - "audio_errors"
    - "gpio_errors"

# Story generation
story:
  num_chapters: 5  # Default number of chapters (editable in Streamlit sidebar)
  chapter_min_words: 150
  chapter_max_words: 300
  context_summary_sentences: 3  # sentences per chapter in cumulative context
  streaming_paragraph_tokens: 50  # Generate text in chunks for TTS streaming
